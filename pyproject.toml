[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mgraph"
version = "0.1.0"
description = "Render cycle-pruned FLAMS definition dependency graphs"
requires-python = ">=3.11"

[project.scripts]
mgraph = "mgraph.cli:main"
stexcasp = "mgraph.stexcasp:main"

[tool.setuptools]
packages = ["mgraph"]
